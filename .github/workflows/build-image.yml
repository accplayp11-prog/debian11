
name: Build & Push Debian 11 Image to VCR

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".github/workflows/build-image.yml"

  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: false
        default: "latest"

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push Debian 11 image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="latest"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Login to Vercel Container Registry
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          test -n "$VERCEL_TOKEN" || (echo "Missing VERCEL_TOKEN" && exit 1)
          test -n "$VERCEL_TEAM_ID" || (echo "Missing VERCEL_ORG_ID" && exit 1)

          printf '%s' "$VERCEL_TOKEN" | docker login vcr.vercel.com \
            --username "$VERCEL_TEAM_ID" \
            --password-stdin

      - name: Build and push Debian 11 image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          IMAGE="vcr.vercel.com/yassinehami652-3530/debian11/debian-11-terminal:${TAG}"

          echo "Building and pushing: $IMAGE"

          docker buildx build \
            --platform linux/amd64 \
            --output "type=image,name=${IMAGE},push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true" \
            .

          echo "Image pushed successfully: $IMAGE"

      - name: Summary
        if: success()
        run: |
          echo "## Debian 11 Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: debian-11-terminal:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          
