
name: Build & Push Debian 11 Image to VCR

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".github/workflows/build-image.yml"

  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: false
        default: "latest"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build and push Debian 11 image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-latest}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify OIDC inputs
        env:
          TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          REPO_ID: ${{ github.repository_id }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow_ref }}
        run: |
          echo "Team: $TEAM_ID"
          echo "Repository: $REPO"
          echo "Repository ID: $REPO_ID"
          echo "Workflow: $WORKFLOW"

      - name: Login to Vercel Container Registry
        uses: vercel/vcr-action/login@v1
        with:
          team: ${{ vars.VERCEL_TEAM_ID }}
          policy: pol_53384459-e142-4095-9a4f-aa6c32180a57

      - name: Build and push Debian 11 image
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          IMAGE="vcr.vercel.com/yassinehami652-3530/debian11/debian-11-terminal:${TAG}"

          echo "Building and pushing: $IMAGE"

          docker buildx build \
            --platform linux/amd64 \
            --output "type=image,name=${IMAGE},push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true" \
            .

          echo "Image pushed successfully: $IMAGE"

      - name: Summary
        if: success()
        run: |
          echo "## Debian 11 Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: debian-11-terminal:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          
